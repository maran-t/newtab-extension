<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="cursor-dot" id="cursor-dot" aria-hidden="true"></div>
    <div class="cursor-ring" id="cursor-ring" aria-hidden="true"></div>

    <span class="greeting" id="greeting">Hello</span>

    <main class="stage" id="stage">
      <p class="date" id="date"></p>
      <h1 class="clock" id="clock">
        <span id="time">00:00:00</span><span class="ms" id="ms">.000</span>
      </h1>
      <div class="timer-controls" id="timer-controls" hidden>
        <div class="preset-row" id="preset-row">
          <button class="preset" data-min="15" aria-label="15 minutes">15</button>
          <button class="preset is-selected" data-min="25" aria-label="25 minutes">25</button>
          <button class="preset" data-min="45" aria-label="45 minutes">45</button>
          <button class="preset" data-min="60" aria-label="60 minutes">60</button>
        </div>
        <div class="action-row" id="action-row">
          <button class="timer-start" id="timer-start">Start</button>
          <button class="timer-cancel" id="timer-cancel">Cancel</button>
        </div>
        <button class="timer-end" id="timer-end" hidden>End</button>
      </div>
    </main>

    <button class="pusher" id="pusher" aria-label="Start a focus session" title="Start a focus session">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="13.5" r="8"></circle>
        <path d="M12 13.5V9.5"></path>
        <path d="M9.5 2.5h5"></path>
        <path d="M12 2.5v3"></path>
      </svg>
    </button>

    <div class="year" id="year" aria-label="Year progress">
      <div class="year-ticks" id="year-ticks"></div>
      <p class="year-label">
        <span id="year-num"></span>
        <span><span class="year-week" id="year-week"></span> · <span class="year-pct" id="year-pct"></span></span>
      </p>
      <button class="countdown" id="countdown" hidden></button>
      <form class="countdown-form" id="countdown-form" hidden>
        <input id="countdown-label" type="text" placeholder="Label — e.g. Launch" maxlength="24" autocomplete="off" spellcheck="false">
        <input id="countdown-date" type="date" aria-label="Target date">
        <button type="submit" class="cd-save">Save</button>
        <button type="button" class="cd-remove" id="countdown-remove" hidden>Remove</button>
      </form>
    </div>

    <div class="year session" id="session" aria-label="Focus session" hidden>
      <div class="year-ticks" id="session-ticks"></div>
      <p class="year-label">
        <span>Focus</span>
        <span class="year-week" id="session-left"></span>
      </p>
    </div>

    <div class="time-up" id="time-up" role="alert">
      <h2>Time.</h2>
      <p id="time-up-sub"></p>
    </div>

    <nav class="dock" id="dock" aria-label="Shortcuts">
      <div class="dock-list" id="dock-list"></div>
      <button class="dock-add" id="dock-add" aria-label="Add shortcut" title="Add shortcut">
        <span class="app-label">Add</span>
        <span class="chip add-chip"><span class="plus" aria-hidden="true"></span></span>
      </button>
    </nav>

    <div class="panel-backdrop" id="panel-backdrop"></div>
    <section class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Add shortcut">
      <header class="panel-head">
        <h2 class="panel-title">Add shortcut</h2>
        <button class="panel-close" id="panel-close" aria-label="Close">&times;</button>
      </header>
      <input
        class="panel-search"
        id="panel-search"
        type="text"
        placeholder="Search bookmarks &amp; history, or paste a URL"
        autocomplete="off"
        spellcheck="false"
      >
      <p class="panel-notice" id="panel-notice" hidden>The dock is full — remove a shortcut first.</p>
      <div class="panel-list" id="panel-list"></div>
    </section>

    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
      <span class="glyph" aria-hidden="true"></span>
    </button>

    <div class="veil" id="veil" aria-hidden="true">
      <div class="launch">
        <span class="launch-dial"></span>
        <p class="launch-label">Opening <span id="launch-host"></span></p>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
