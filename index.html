<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <h1 style="position: absolute; top: 80px; left: 10px; transform: rotate(-90deg);">Hello,</h1>

    <div style="height: 26px; width: 24px; background-color: black; position: absolute; left: 0px; bottom: 24%; cursor: pointer; z-index: 1;"></div>
   
    <div id="loader" class="loader"></div>
    <div id="backdrop" class="backdrop"></div>

    <div class="ico" style="z-index: 1;">
      <a href="https://www.google.com" class="app-link ico" style="bottom: 40px;">
        <img src="logo/google.png" alt="Google" class="app-icon ico">
      </a>
    
      <a href="https://www.linkedin.com" class="app-link ico" style="bottom: 100px;">
        <img src="logo/linkedin.png" alt="LinkedIn" class="app-icon ico">
      </a>
    
      <a href="https://www.github.com" class="app-link ico" style="bottom: 160px;">
        <img src="logo/github.png" alt="GitHub" class="app-icon ico">
      </a>
    
      <a href="https://www.medium.com" class="app-link ico" style="bottom: 220px;">
        <img src="logo/medium.png" alt="Medium" class="app-icon ico">
      </a>
    </div>

    <div id="cursor-p" class="cursor" style="top: -20px; left: 0; z-index: 1"></div>
    <div style="z-index: 1;">
      <p id="date"></p>
      <p style="margin-left: 28px;"></p>
      <span id="time"></span>
    </div>
    <script src="index.js"></script>
  </body>
</html>
